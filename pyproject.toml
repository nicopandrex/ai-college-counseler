[project]
name = "degree-planner"
version = "0.0.0"
requires-python = ">=3.12,<3.14"
dependencies = ["planner-ingest", "planner-solver"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["ingest", "solver"]

[tool.uv.sources]
planner-ingest = { workspace = true }
planner-solver = { workspace = true }

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==8.3.4", "ruff==0.8.4"]

[tool.pytest.ini_options]
testpaths = ["ingest/tests", "solver/tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
